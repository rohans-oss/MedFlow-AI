name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medflow
          POSTGRES_PASSWORD: medflow
          POSTGRES_DB: medflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medflow" --health-interval 5s --health-timeout 3s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-only-neo4j-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-neo4j-password 'RETURN 1'" --health-interval 10s
          --health-timeout 10s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://medflow:medflow@localhost:5432/medflow_test
      DATABASE_URL: postgresql+psycopg://medflow:medflow@localhost:5432/medflow_test
      # V6: graph-store tests run against a real Neo4j here (they are skipped when TEST_GRAPH_URL is unset)
      TEST_GRAPH_URL: bolt://localhost:7687
      TEST_GRAPH_PASSWORD: ci-only-neo4j-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app tests
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medflow
          POSTGRES_PASSWORD: medflow
          POSTGRES_DB: medflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medflow" --health-interval 5s --health-timeout 3s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-only-neo4j-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-neo4j-password 'RETURN 1'" --health-interval 10s
          --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://medflow:medflow@localhost:5432/medflow
      JWT_SECRET: ci-only-secret-value-not-used-anywhere-else
      GRAPH_BACKEND: neo4j
      GRAPH_URL: bolt://localhost:7687
      GRAPH_PASSWORD: ci-only-neo4j-password
      # V9: the local reference ERP simulator (simulated data for demo hospitals) for the integrations E2E spec
      REFERENCE_ERP_ENABLED: "true"
      REFERENCE_ERP_TOKEN: ci-only-reference-erp-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start API with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head && python -m app.seed && python -m app.ml.train
          python -m app.graph.cli check   # every MedFlow Cypher query against Neo4j
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
          nohup node .next/standalone/server.js > web.log 2>&1 &
          npx wait-on http://localhost:3000/login http://localhost:8000/api/health
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/test-results
            backend/api.log
            frontend/web.log
